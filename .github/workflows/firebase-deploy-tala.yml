name: Deploy to Firebase Hosting (tala)

# Manual only: run it from the Actions tab once the site is ready to go live.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build site into public/
        run: npm run build:hosting --prefix frontend

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/685366123190/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deploy@skip-class-slsru4.iam.gserviceaccount.com'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.34.1

      - name: Deploy to Firebase Hosting (tala target)
        run: firebase deploy --only hosting:tala --project skip-class-slsru4 --non-interactive
