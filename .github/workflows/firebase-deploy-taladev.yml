name: Deploy to Firebase Hosting (taladev)

# Manual only: run it from the Actions tab once the site is ready to go live.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build site into public/
        run: npm run build:hosting --prefix frontend
        env:
          VITE_PAYMENT_LINK_ENROLLMENT: "https://payments-na1.hubspot.com/payments/SMKcGdqR2?referrer=PAYMENT_LINK"
          VITE_PAYMENT_LINK_INSTRUCTION: "https://payments-na1.hubspot.com/payments/4JW4fSGwNK2p6?referrer=PAYMENT_LINK"
          # Sign-in-only Firebase mode on skip-class-slsru4 (Google sign-in;
          # no TALA data reads or writes). The web app values are public and
          # live in GitHub repository variables, not in the repo.
          VITE_BACKEND_MODE: firebase
          VITE_DEMO_MODE: "false"
          VITE_DEMO_TOOLS: "false"
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/685366123190/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deploy@skip-class-slsru4.iam.gserviceaccount.com'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.34.1

      - name: Configure Firebase Hosting target
        run: firebase target:apply hosting taladev taladev --project skip-class-slsru4

      - name: Deploy to Firebase Hosting (taladev target)
        run: firebase deploy --only hosting:taladev --project skip-class-slsru4 --non-interactive
